<title>우리 가족 도쿄 4일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 역 안내판처럼 — 상단 고정 탭(일자) + 세로 노선도형 타임라인. 폰 한 손 조작 기준. */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --ink:#18201b; --muted:#5d6b62; --line:#d9e0da;
  --accent:#3f7a12; --accent-soft:#e6f1da; --warn:#a14a00; --warn-soft:#fdf0e1; --now:#c2185b;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  /* 노선 색 (데이터) */
  --jy:#80c241; --ks:#1e50a2; --si:#f39800; --e:#cf3366; --g:#f39700; --in:#8a3fa0; --oh:#1a8bd0; --jc:#f15a22; --walk:#7b8a80; --bus:#d07a00; --taxi:#d4a400;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211c; --ink:#e7ede8; --muted:#9aa89f; --line:#2d3830;
  --accent:#9fd36a; --accent-soft:#233420; --warn:#ffb36b; --warn-soft:#3a2a18; --now:#ff6fa5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211c; --ink:#e7ede8; --muted:#9aa89f; --line:#2d3830;
  --accent:#9fd36a; --accent-soft:#233420; --warn:#ffb36b; --warn-soft:#3a2a18; --now:#ff6fa5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{padding-block:20px 12px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,36px);line-height:1.15;margin:0;text-wrap:balance}
.flights{display:flex;flex-wrap:wrap;gap:8px}
.flight{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.flight b{font-family:var(--f-mono);font-size:13px}
.flight span{font-size:13px;color:var(--muted)}
.nowbar{display:none;background:var(--surface);border:1.5px solid var(--now);border-radius:10px;padding:10px 12px;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.nowbar.on{display:grid}
.nowbar .k{font-family:var(--f-mono);font-size:11px;color:var(--now);letter-spacing:.08em}
.nowbar strong{font-size:15px}
.dday{font-size:13px;color:var(--muted)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px/1 var(--f-body);padding:9px 12px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.tab:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section.panel{padding-top:18px;display:grid;gap:16px}
.dayhead{display:grid;gap:6px}
.dayhead h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
.dayhead p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.w{background:var(--warn-soft);color:var(--warn)}

/* 타임라인 = 노선도 */
ol.tl{list-style:none;margin:0;padding:0;position:relative}
ol.tl::before{content:"";position:absolute;left:51px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--line)}
.stop{display:grid;grid-template-columns:44px 18px minmax(0,1fr);column-gap:8px;padding-block:6px}
.stop .t{font-family:var(--f-mono);font-size:13px;font-weight:700;padding-top:12px;text-align:right;font-variant-numeric:tabular-nums}
.stop .dot{width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);margin-top:13px;position:relative;z-index:1}
.stop.move .dot{border-color:var(--muted);width:14px;height:14px;margin:15px 2px 0;border-width:3px}
.stop.eat .dot{border-color:var(--warn)}
.stop.see .dot{border-color:var(--accent)}
.stop.is-now .dot{border-color:var(--now);box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 25%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.stop.move .card{background:transparent;border-style:dashed}
.stop.is-now .card{border-color:var(--now);border-width:1.5px}
.card h3{margin:0;font-size:16px;line-height:1.35;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.badge-now{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:#fff;background:var(--now);padding:2px 6px;border-radius:4px}
.card .sub{font-size:13px;color:var(--muted);margin-top:-4px}
.card ul{margin:0;padding-left:18px;display:grid;gap:3px}
.card li{font-size:14px}
.route{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.ln{font:700 11px/1 var(--f-mono);color:#fff;padding:5px 6px;border-radius:5px;min-width:44px;text-align:center;margin-top:1px}
.ln.walk{background:var(--walk)}.ln.jy{background:var(--jy);color:#10240a}.ln.ks{background:var(--ks)}.ln.si{background:var(--si);color:#2a1700}.ln.e{background:var(--e)}.ln.g{background:var(--g);color:#2a1700}.ln.in{background:var(--in)}.ln.oh{background:var(--oh)}.ln.jc{background:var(--jc)}.ln.bus{background:var(--bus)}.ln.taxi{background:var(--taxi);color:#2a2000}
.leg .st{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin:0 2px;color:var(--muted)}
.leg em{font-style:normal;color:var(--muted);font-size:13px}
.note{font-size:13px;border-radius:8px;padding:8px 10px;background:var(--accent-soft);color:var(--ink)}
.note.w{background:var(--warn-soft)}
.note b{color:var(--accent)} .note.w b{color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:600 12px/1 var(--f-body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.btn.jp{border-color:var(--ink)}

/* 정보 패널 */
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.block h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px}
.block h4{margin:4px 0 0;font-size:15px}
.block p{margin:0}
.block ol,.block ul{margin:0;padding-left:20px;display:grid;gap:5px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;font-size:14px}
.pill{font:700 11px/1 var(--f-mono);padding:5px 7px;border-radius:5px;white-space:nowrap;align-self:start}
.pill.y{background:var(--accent-soft);color:var(--accent)}.pill.n{background:var(--warn-soft);color:var(--warn)}
.check{display:grid;gap:2px}
.check label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.check label:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.foot{font-size:12px;color:var(--muted)}

/* 택시 카드 */
.jpcard{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.jpcard .in{display:grid;gap:18px;text-align:center;max-width:640px;width:100%}
.jpcard .say{font-size:15px;color:var(--muted)}
.jpcard .big{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",var(--f-display);font-weight:800;font-size:clamp(28px,8vw,48px);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.jpcard .addr{font-size:clamp(18px,5vw,26px);font-weight:600}
@media (prefers-reduced-motion:no-preference){.stop.is-now .dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--now) 10%,transparent)}}}
</style>

const CHECKS = [
 "여권 3개 (아이 여권은 공항 Suica 창구에서 필요)",
 "Visit Japan Web 등록 · 입국 QR 캡처",
 "해리포터 10/26 09:00 입장 QR 저장",
 "스카이라이너 e-ticket (편도 ×2, 어른 2·아이 1)",
 "엔화 현금 (Suica 충전·いせや용, 1인 ¥20,000 정도)",
 "eSIM / 로밍",
 "숙소 체크인 안내·비밀번호 캡처",
 "제주항공 온라인 체크인 (출국 전날)",
 "포켓몬센터 입장 방식 전날 확인",
 "Uber 또는 GO 택시 앱 설치",
 "보조배터리 · 얇은 겉옷 (10월 말 도쿄 약 13~20℃)"
];

/* ---------- 렌더 ---------- */
const TABS = [{id:"prep",tab:"준비"},...DAYS.map(d=>({id:d.id,tab:d.tab,dow:d.dow,date:d.date})),{id:"move",tab:"교통"},{id:"food",tab:"식사"}];
const $ = s => document.querySelector(s);
const toMin = t => {const [h,m]=t.split(":").map(Number);return h*60+m};
function jstNow(){const d=new Date(Date.now()+9*3600e3);return {date:d.toISOString().slice(0,10),min:d.getUTCHours()*60+d.getUTCMinutes(),ms:d.getTime()}}

function renderTabs(active){
  $("#tabs").innerHTML = TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${t.id===active}" data-id="${t.id}">${t.tab}${t.dow?` <small>${t.date.slice(5).replace("-","/")} ${t.dow}</small>`:""}</button>`).join("");
}
function stopHTML(s,i,state){
  const route = s.route?`<ul class="route">${s.route.map(([l,txt])=>`<li class="leg"><span class="ln ${l}">${({walk:"도보",jy:"JR",ks:"京成",si:"西武",e:"大江戸",g:"銀座",in:"京王",oh:"小田急",jc:"中央",bus:"버스",taxi:"택시"})[l]}</span><span>${txt}</span></li>`).join("")}</ul>`:"";
  const body = s.body?`<ul>${s.body.map(b=>`<li>${b}</li>`).join("")}</ul>`:"";
  const note = s.note?`<div class="note ${s.note[1]||""}">${s.note[0]}</div>`:"";
  const acts = [];
  if(s.map) acts.push(`<a class="btn" href="${s.map}" target="_blank" rel="noopener">구글맵</a>`);
  if(s.link) acts.push(`<a class="btn" href="${s.link[1]}" target="_blank" rel="noopener">${s.link[0]}</a>`);
  if(s.jp) acts.push(`<button class="btn jp" type="button" data-jp="${s.jp}">택시 기사님께 보여주기</button>`);
  return `<li class="stop ${s.type} ${state}" id="stop-${i}"><div class="t">${s.t}</div><div class="dot"></div>
   <div class="card"><h3>${state==="is-now"?'<span class="badge-now">지금</span>':''}${s.title}</h3>${s.sub?`<div class="sub">${s.sub}</div>`:""}${route}${body}${note}${acts.length?`<div class="acts">${acts.join("")}</div>`:""}</div></li>`;
}
function currentIdx(day){
  const n=jstNow(); if(n.date!==day.date) return -1;
  let idx=-1; day.stops.forEach((s,i)=>{if(toMin(s.t)<=n.min) idx=i}); return idx;
}
function render(id){
  renderTabs(id);
  try{localStorage.setItem("tyo-tab",id)}catch(e){}
  const d = DAYS.find(x=>x.id===id);
  if(!d){ $("#main").innerHTML=`<section class="panel" role="tabpanel">${PANELS[id]}</section>`; if(id==="prep") renderChecks(); return; }
  const ci = currentIdx(d);
  $("#main").innerHTML = `<section class="panel" role="tabpanel">
   <div class="dayhead"><div class="eyebrow">DAY ${d.tab[0]} · ${d.date.replace(/-/g,".")} ${d.dow}</div><h2>${d.title}</h2><p>${d.lead}</p>
   <div class="chips">${d.chips.map(c=>`<span class="chip ${c[1]||""}">${c[0]}</span>`).join("")}</div></div>
   <ol class="tl">${d.stops.map((s,i)=>stopHTML(s,i,i===ci?"is-now":"")).join("")}</ol></section>`;
}
function renderChecks(){
  let saved={}; try{saved=JSON.parse(localStorage.getItem("tyo-checks")||"{}")}catch(e){}
  $("#checks").innerHTML = CHECKS.map((c,i)=>`<label for="ck${i}"><input type="checkbox" id="ck${i}" ${saved[i]?"checked":""}><span>${c}</span></label>`).join("");
  $("#checks").addEventListener("change",e=>{const i=e.target.id.slice(2);saved[i]=e.target.checked;try{localStorage.setItem("tyo-checks",JSON.stringify(saved))}catch(err){}});
}
function updateNow(){
  const n=jstNow(); const d=DAYS.find(x=>x.date===n.date);
  const bar=$("#nowbar");
  if(d){
    const i=currentIdx(d); const s=i>=0?d.stops[i]:null; const nx=d.stops[i+1];
    bar.classList.add("on"); bar.dataset.day=d.id;
    $("#nowk").textContent=`지금 · DAY ${d.tab[0]}`;
    $("#nowt").textContent= s? `${s.t} ${s.title}` : `오늘 첫 일정 ${d.stops[0].t} ${d.stops[0].title}`;
    $("#nown").textContent= nx && s ? `다음 ${nx.t} · ${nx.title}` : "";
    $("#dday").textContent="";
  } else {
    bar.classList.remove("on");
    const start=Date.UTC(2026,9,24); const diff=Math.ceil((start-n.ms)/864e5);
    $("#dday").textContent = diff>0 ? `출발까지 D-${diff}` : "";
  }
}

/* events */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b){render(b.dataset.id);window.scrollTo({top:0})}});
$("#nowbar").addEventListener("click",()=>{const id=$("#nowbar").dataset.day;render(id);const el=document.querySelector(".stop.is-now");if(el)el.scrollIntoView({block:"center"})});
document.addEventListener("click",e=>{const b=e.target.closest("[data-jp]");if(!b)return;const c=JP[b.dataset.jp];$("#jpbig").textContent=c.jp;$("#jpaddr").textContent=c.addr;$("#jpcard").hidden=false;});
$("#jpclose").addEventListener("click",()=>{$("#jpcard").hidden=true});

/* init: 여행 당일이면 그날 탭 */
(function(){
  const n=jstNow(); const today=DAYS.find(d=>d.date===n.date);
  let start=today?today.id:null;
  if(!start){try{start=localStorage.getItem("tyo-tab")}catch(e){}}
  if(!start||!TABS.find(t=>t.id===start)) start="d1";
  render(start); updateNow(); setInterval(()=>{updateNow(); const a=document.querySelector('.tab[aria-selected="true"]'); if(a && DAYS.find(d=>d.id===a.dataset.id)) {const y=scrollY;render(a.dataset.id);scrollTo(0,y)}},60000);
})();
</script>
